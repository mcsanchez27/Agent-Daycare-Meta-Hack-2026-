<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Agent Daycare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Agent Daycare</div>
    <button type="button" class="new-chat" id="new-chat">+ New chat</button>
    <nav class="chat-list" id="chat-list" aria-label="Chats"></nav>
  </aside>

  <section class="chat">
    <header class="top">
      <div class="folder" id="folder" title="Agents work in this folder">Working folder: …</div>
    </header>

    <div class="thread-bar" id="thread-bar" hidden>
      <button type="button" id="back">← Back to chat</button>
      <span id="thread-label">Thread</span>
    </div>

    <main class="thread" id="thread" aria-live="polite">
      <p class="empty" id="empty">Pick an agent below and say hi.</p>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <div class="picker" id="picker" role="radiogroup" aria-label="Send to"></div>
      <div class="input-row">
        <textarea id="message" rows="1" placeholder="Message Claude… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </section>

  <script src="thread.js"></script>
  <script src="app.js"></script>
</body>
</html>
