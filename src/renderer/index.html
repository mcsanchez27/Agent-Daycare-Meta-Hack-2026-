<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Agent Daycare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Agent Daycare</div>
    <div class="plan" id="plan" hidden></div>
    <button type="button" class="new-chat" id="new-chat">+ New chat</button>
    <nav class="chat-list" id="chat-list" aria-label="Chats"></nav>
  </aside>

  <section class="chat">
    <header class="top">
      <div class="members" id="members" aria-label="Agents in this chat"></div>
      <button type="button" class="add-agent" id="add-agent" title="Add a new agent, or one from another chat">+ Add agent</button>
      <div class="folder" id="folder" title="Agents work in this folder">Working folder: …</div>
    </header>

    <section class="chooser" id="chooser" hidden aria-label="Pick an agent for the new chat"></section>

    <main class="thread" id="thread" aria-live="polite">
      <p class="empty" id="empty">Say hi.</p>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <div class="mentions" id="mentions" role="listbox" aria-label="Bring in an agent" hidden></div>
      <div class="input-row">
        <textarea id="message" rows="1" placeholder="Message Claude… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </section>

  <!-- Threads open beside the main chat (TM-54 Batch 4). -->
  <aside class="thread-panel" id="thread-panel" hidden aria-label="Thread">
    <header class="panel-top">
      <span class="panel-label" id="panel-label">Thread</span>
      <button type="button" class="panel-close" id="panel-close" title="Close the thread">×</button>
    </header>
    <div class="thread" id="panel-thread" aria-live="polite"></div>
    <form class="composer" id="panel-composer" autocomplete="off">
      <div class="mentions" id="panel-mentions" role="listbox" aria-label="Bring in an agent" hidden></div>
      <div class="input-row">
        <textarea id="panel-message" rows="1" aria-label="Reply in the thread"></textarea>
        <button type="submit" id="panel-send">Send</button>
      </div>
    </form>
  </aside>

  <script src="members.js"></script>
  <script src="thread.js"></script>
  <script src="app.js"></script>
</body>
</html>
